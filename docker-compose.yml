services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "3000"
      DATABASE_PATH: /app/data/worktoon.db
      ALLOWED_ORIGIN: http://localhost:5173
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - worktoon_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  worktoon_data:
